name: Deploy to VPS

# ============================================================
# PURPOSE: Deploy AcquireIQ to a Linux VPS running Apache and
# Docker (the planned primary deployment). Builds and restarts
# the backend container and publishes the frontend as static
# files behind Apache. The AWS deployment in deploy-to-aws.yml is
# a separate, optional path.
#
# TRIGGERS: automatically on every push to main, and by hand from
# the Actions tab (workflow_dispatch). Until the one-time server
# setup below is done, runs fail at the secrets or SSH check,
# before anything on a server is changed.
#
# PUBLIC LAYOUT (PUBLIC_BASE_PATH below, default /mvps/acquireiq):
#   https://<domain>/mvps/acquireiq/            React static build
#   https://<domain>/mvps/acquireiq/api/*       backend
#   https://<domain>/mvps/acquireiq/requests*   backend
#   https://<domain>/mvps/acquireiq/dashboard   backend
#   https://<domain>/mvps/acquireiq/assist/*    backend
#
# ONE-TIME SERVER SETUP (not done by this workflow):
#   1. Docker installed, and VPS_USER able to run docker.
#   2. PostgreSQL installed, the schema created with
#      backend/scripts/setup-database.sql, and PostgreSQL
#      accepting connections from Docker containers.
#   3. Apache with mod_proxy, and the ProxyPass rules printed by
#      the "Confirm Apache" step below added to the site's config.
#   4. VPS_STATIC_PATH served by Apache at PUBLIC_BASE_PATH, and
#      writable by VPS_USER.
#   5. Host port 3002 free; the backend binds to 127.0.0.1:3002.
#   Run dev_scripts\deploy_setup.bat to create the SSH key and set
#   the GitHub secrets.
#
# Two jobs:
#   1. verify-build: runs on the GitHub runner only. Type-checks
#      the backend, builds the backend Docker image, and builds the
#      frontend. Nothing touches the server if this fails.
#   2. deploy: confirms secrets, SSH and the Apache rules, syncs
#      source, writes backend/.env from secrets, rebuilds and
#      restarts the backend container, builds the frontend in a
#      throwaway container on the server, publishes it, and checks
#      the public health endpoint.
#
# Required repository secrets:
#   VPS_HOST            server hostname or IP
#   VPS_USER            SSH user on the server
#   VPS_SSH_KEY         private key for that user (deploy_setup.bat)
#   VPS_PROJECT_PATH    source/build folder, e.g. /opt/acquireiq
#   VPS_STATIC_PATH     folder Apache serves at PUBLIC_BASE_PATH
#   PUBLIC_HEALTH_URL   https://<domain>/mvps/acquireiq/api/health
#   DATABASE_URL        connection string the container uses, e.g.
#                       postgresql://acquireiq_app:<password>@host.docker.internal:5432/acquireiq
#                       (host.docker.internal is mapped to the host
#                       by --add-host below)
#   OPENAI_API_KEY      OpenAI key for AI-assisted search
# Optional:
#   OPENAI_MODEL        overrides the default model (gpt-5.4-mini)
# ============================================================

"on":
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  PUBLIC_BASE_PATH: /mvps/acquireiq
  APP_NAME: acquireiq

jobs:
  verify-build:
    name: Verify build (GitHub runner, no server involved)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend - install deps
        working-directory: backend
        run: npm install

      - name: Backend - generate OpenAPI schemas
        working-directory: backend
        run: npm run generate:schemas

      - name: Backend - type check (strict TypeScript)
        working-directory: backend
        run: npx tsc --noEmit

      - name: Backend - Docker build
        working-directory: backend
        run: docker build -t "${APP_NAME}-backend-verify" .

      - name: Frontend - install deps
        working-directory: frontend
        run: npm install

      - name: Frontend - production build with the VPS base path
        working-directory: frontend
        env:
          VITE_BASE_PATH: ${{ env.PUBLIC_BASE_PATH }}/
          VITE_API_BASE: ${{ env.PUBLIC_BASE_PATH }}
        run: npm run build

      - name: Frontend - confirm build output exists
        working-directory: frontend
        run: |
          set -euo pipefail
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: npm run build reported success but dist/index.html is missing."
            exit 1
          fi
          echo "Frontend build output confirmed at dist/index.html"

  deploy:
    name: Deploy backend + frontend to VPS
    runs-on: ubuntu-latest
    needs: [verify-build]
    steps:
      # Deliberately here, not in verify-build, so verify-build stays
      # secret-free and safe to run locally with act.
      - name: Confirm required secrets are set
        run: |
          set -euo pipefail
          missing=""
          [ -z "${{ secrets.VPS_HOST }}" ] && missing="$missing VPS_HOST"
          [ -z "${{ secrets.VPS_USER }}" ] && missing="$missing VPS_USER"
          [ -z "${{ secrets.VPS_SSH_KEY }}" ] && missing="$missing VPS_SSH_KEY"
          [ -z "${{ secrets.VPS_PROJECT_PATH }}" ] && missing="$missing VPS_PROJECT_PATH"
          [ -z "${{ secrets.VPS_STATIC_PATH }}" ] && missing="$missing VPS_STATIC_PATH"
          [ -z "${{ secrets.PUBLIC_HEALTH_URL }}" ] && missing="$missing PUBLIC_HEALTH_URL"
          [ -z "${{ secrets.DATABASE_URL }}" ] && missing="$missing DATABASE_URL"
          [ -z "${{ secrets.OPENAI_API_KEY }}" ] && missing="$missing OPENAI_API_KEY"
          if [ -n "$missing" ]; then
            echo "Missing required repository secrets:$missing"
            echo "Set these under Settings -> Secrets and variables -> Actions, or run dev_scripts\\deploy_setup.bat."
            exit 1
          fi
          echo "All required secrets are present."

      - uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Confirm SSH connection to VPS
        run: |
          ssh -o ConnectTimeout=10 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" 'echo "SSH connection OK, connected as $(whoami) on $(hostname)"'

      # Check-only, never auto-edited: the Apache config is shared with
      # every other site on the server, so a bad automated edit could
      # take all of them down. Fails early with the exact rules to add.
      - name: Confirm Apache has the proxy rules for this app
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "
            set -eu
            if ! grep -rqsE 'ProxyPass[[:space:]]+\"${{ env.PUBLIC_BASE_PATH }}/api/\"' /etc/apache2/; then
              echo 'ERROR: Apache has no ProxyPass rules for ${{ env.PUBLIC_BASE_PATH }} yet.'
              echo 'Add these to the site configuration under /etc/apache2/ (one-time, manual):'
              echo ''
              echo '  ProxyPreserveHost On'
              echo '  ProxyPass        \"${{ env.PUBLIC_BASE_PATH }}/api/\"       \"http://127.0.0.1:3002/api/\"'
              echo '  ProxyPassReverse \"${{ env.PUBLIC_BASE_PATH }}/api/\"       \"http://127.0.0.1:3002/api/\"'
              echo '  ProxyPass        \"${{ env.PUBLIC_BASE_PATH }}/requests\"   \"http://127.0.0.1:3002/requests\"'
              echo '  ProxyPassReverse \"${{ env.PUBLIC_BASE_PATH }}/requests\"   \"http://127.0.0.1:3002/requests\"'
              echo '  ProxyPass        \"${{ env.PUBLIC_BASE_PATH }}/dashboard\"  \"http://127.0.0.1:3002/dashboard\"'
              echo '  ProxyPassReverse \"${{ env.PUBLIC_BASE_PATH }}/dashboard\"  \"http://127.0.0.1:3002/dashboard\"'
              echo '  ProxyPass        \"${{ env.PUBLIC_BASE_PATH }}/assist/\"    \"http://127.0.0.1:3002/assist/\"'
              echo '  ProxyPassReverse \"${{ env.PUBLIC_BASE_PATH }}/assist/\"    \"http://127.0.0.1:3002/assist/\"'
              echo ''
              echo 'Then: sudo apachectl configtest && sudo systemctl reload apache2'
              exit 1
            fi
            echo 'Apache proxy rules for this app confirmed present.'
          "

      - name: Create server directories if they don't exist
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -eu
            mkdir -p "${{ secrets.VPS_PROJECT_PATH }}/backend"
            mkdir -p "${{ secrets.VPS_PROJECT_PATH }}/frontend"
            mkdir -p "${{ secrets.VPS_STATIC_PATH }}"
            echo "Server directories confirmed/created."
          '

      - name: Sync source files to the server
        # .env is excluded because the next step writes it from secrets.
        run: |
          set -eo pipefail
          rsync -az --delete \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude '.env' \
            --exclude '.git' \
            ./backend/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PROJECT_PATH }}/backend/"
          rsync -az --delete \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude '.git' \
            ./frontend/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PROJECT_PATH }}/frontend/"

      - name: Confirm source files landed on the server
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -eu
            if [ ! -f "${{ secrets.VPS_PROJECT_PATH }}/backend/src/server.ts" ]; then
              echo "ERROR: backend/src/server.ts not found on the server after rsync."
              exit 1
            fi
            if [ ! -f "${{ secrets.VPS_PROJECT_PATH }}/frontend/package.json" ]; then
              echo "ERROR: frontend/package.json not found on the server after rsync."
              exit 1
            fi
            echo "Source files confirmed present on the server."
          '

      # Written on every deploy, so a secret rotated in GitHub reaches
      # the server on the next run with no manual step there.
      - name: Write backend .env from GitHub secrets
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -eu
            umask 077
            {
              echo "PORT=3002"
              echo "DATABASE_URL=${{ secrets.DATABASE_URL }}"
              echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"
              echo "OPENAI_MODEL=${{ secrets.OPENAI_MODEL }}"
              echo "LOG_LEVEL=none"
            } > "${{ secrets.VPS_PROJECT_PATH }}/backend/.env"
            grep -q "^DATABASE_URL=." "${{ secrets.VPS_PROJECT_PATH }}/backend/.env"
            echo "backend/.env written."
          '

      - name: Rebuild and restart backend container
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -eu
            cd "${{ secrets.VPS_PROJECT_PATH }}/backend"
            docker build -t ${{ env.APP_NAME }}-backend .
            docker rm -f ${{ env.APP_NAME }}-backend || true
            docker run -d \
              --name ${{ env.APP_NAME }}-backend \
              --restart unless-stopped \
              --add-host=host.docker.internal:host-gateway \
              -p 127.0.0.1:3002:3002 \
              --env-file .env \
              ${{ env.APP_NAME }}-backend
          '

      - name: Confirm backend container is running and healthy
        run: |
          sleep 3
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -eu
            if ! docker ps --filter "name=${{ env.APP_NAME }}-backend" --filter "status=running" | grep -q ${{ env.APP_NAME }}-backend; then
              echo "ERROR: ${{ env.APP_NAME }}-backend container is not running after deploy."
              docker logs --tail 50 ${{ env.APP_NAME }}-backend || true
              exit 1
            fi
            curl -sf http://127.0.0.1:3002/api/health
            echo
            echo "Backend container running and answering on loopback."
          '

      - name: Build frontend in a throwaway container on the server
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -eu
            docker run --rm \
              -v "${{ secrets.VPS_PROJECT_PATH }}/frontend:/app" \
              -w /app \
              -e VITE_BASE_PATH=${{ env.PUBLIC_BASE_PATH }}/ \
              -e VITE_API_BASE=${{ env.PUBLIC_BASE_PATH }} \
              node:20-alpine sh -c "npm install && npm run build"
            if [ ! -f "${{ secrets.VPS_PROJECT_PATH }}/frontend/dist/index.html" ]; then
              echo "ERROR: frontend/dist/index.html not found on the server after build."
              exit 1
            fi
            echo "Frontend build output confirmed on the server."
          '

      - name: Publish frontend to the Apache static directory
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -eu
            rsync -a --delete \
              "${{ secrets.VPS_PROJECT_PATH }}/frontend/dist/" \
              "${{ secrets.VPS_STATIC_PATH }}/"
            if [ ! -f "${{ secrets.VPS_STATIC_PATH }}/index.html" ]; then
              echo "ERROR: index.html not found in the static directory after rsync."
              exit 1
            fi
            echo "Frontend published."
          '

      - name: Verify backend health through the public URL
        run: |
          for i in $(seq 1 10); do
            RESPONSE=$(curl -s "${{ secrets.PUBLIC_HEALTH_URL }}" || true)
            if curl -sf "${{ secrets.PUBLIC_HEALTH_URL }}" > /dev/null; then
              echo "Deployment verified healthy."
              echo "Response: $RESPONSE"
              exit 0
            fi
            echo "Attempt $i/10: not healthy yet. Last response: $RESPONSE"
            sleep 3
          done
          echo "Health check failed after deployment."
          exit 1
