name: Code Checks (type-check + boot test)

# ============================================================
# PURPOSE: Check the frontend build, backend types, and backend
# startup/database access. Does not deploy or contact the VPS.
#
# TRIGGERS: automatically, on every push to main AND every pull
# request targeting main; also runnable by hand from the GitHub
# Actions tab (workflow_dispatch). Runs on GitHub's disposable
# runner, never on your VPS.
# ============================================================
#
# Three jobs. frontend-build is independent and listed first; the
# other two, in increasing order of what they actually require,
# cover the backend:
#   1. frontend-build — installs deps, runs the real production
#      build (npm run build), and confirms dist/index.html actually
#      got created. Independent of the other two jobs, runs in
#      parallel, not sequentially after them.
#   2. type-check — regenerates schemas.generated.ts from the current
#      TypeScript contracts (swagger-spec.ts imports it),
#      then confirms the full backend type-checks cleanly under
#      strict: true (npx tsc --noEmit). Stronger than a plain-JS
#      syntax check: this catches real type errors, not just parse
#      errors. No secrets needed, always runs.
#   3. boot-test — initializes a disposable PostgreSQL database with
#      scripts/setup-database.sql, installs deps, regenerates schemas,
#      compiles (npm run build), and boots dist/server.js. Checks
#      /api/health's JSON body, /api/docs, and a database-backed
#      GET /requests. No seed data or OpenAI key is needed for these
#      checks. This is a startup/database smoke test, not the full
#      backend regression suite or a live AI integration test.
#
# Every multi-line `run:` block below uses `set -euo pipefail`, not
# just `set -e`: `-u` fails loudly on an unset variable instead of
# silently treating it as empty, and `-o pipefail` makes a failure
# anywhere in a piped command fail the whole step instead of only
# reflecting the exit code of the last command in the pipe.
#
# RELATIONSHIP TO deploy-to-vps.yml: deploy-to-vps.yml's own
# verify-build job runs independently. A failure in this workflow
# does not block that separate deployment workflow. The deployment
# workflow still contains unadapted template configuration.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow a manual check without requiring a new push.
  workflow_dispatch: {}

jobs:
  frontend-build:
    name: Frontend build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Production build
        run: npm run build

      - name: Confirm build output exists
        run: |
          set -euo pipefail
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: npm run build reported success but dist/index.html is missing."
            echo "Check vite.config.js for a custom build.outDir pointing elsewhere."
            exit 1
          fi
          echo "Frontend build output confirmed at dist/index.html"

  type-check:
    name: Type check (TypeScript, strict)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # Full install, not --omit=dev: typescript, @types/*, and the
        # OpenAPI schema generator (ts-json-schema-generator, tsx)
        # are all devDependencies, needed here to type-check and to
        # generate schemas.generated.ts.
        run: npm install

      - name: Generate OpenAPI schemas
        # Regenerate the checked-in schema module from current TypeScript
        # contracts before checking swagger-spec.ts and its imports.
        run: npm run generate:schemas

      - name: Type-check entire backend (no output emitted)
        run: npx tsc --noEmit

  boot-test:
    name: Boot test (live server, compiled output)
    runs-on: ubuntu-latest
    # These credentials are fixtures for this disposable CI database only.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: acquireiq_ci_admin
          POSTGRES_DB: postgres
        # Published on host port 55432, not 5432, so it never clashes
        # with a PostgreSQL already running on the developer's machine
        # when this job is run locally with act.
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PORT: 3002
    defaults:
      run:
        working-directory: backend
    needs: [type-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Initialize disposable AcquireIQ database
        # Connects with the psql client over the network rather than
        # docker exec, so the same step works on GitHub's runners and
        # locally under act. The address that reaches the PostgreSQL
        # service differs: 127.0.0.1:55432 on GitHub's runners, and
        # under act either the service name on port 5432 or
        # host.docker.internal:55432 (Docker Desktop). The first that
        # answers is used.
        env:
          PGUSER: postgres
          PGPASSWORD: acquireiq_ci_admin
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            SUDO=""; if command -v sudo >/dev/null 2>&1; then SUDO=sudo; fi
            $SUDO apt-get update -qq && $SUDO apt-get install -y -qq postgresql-client >/dev/null
          fi
          DB_HOST=""
          DB_PORT=""
          for i in $(seq 1 5); do
            for hp in 127.0.0.1:55432 postgres:5432 host.docker.internal:55432; do
              h="${hp%:*}"; p="${hp#*:}"
              if pg_isready -h "$h" -p "$p" -d postgres -t 2 >/dev/null 2>&1; then
                DB_HOST="$h"; DB_PORT="$p"
                break 2
              fi
            done
            echo "Waiting for PostgreSQL ($i/5)..."
            sleep 1
          done
          if [ -z "$DB_HOST" ]; then
            echo "ERROR: PostgreSQL service did not answer on 127.0.0.1:55432, postgres:5432 or host.docker.internal:55432."
            exit 1
          fi
          echo "PostgreSQL reachable at $DB_HOST:$DB_PORT"
          export PGHOST="$DB_HOST" PGPORT="$DB_PORT"
          # Precreate the application role with CI-only credentials. The
          # unchanged bootstrap skips role creation when the role exists.
          psql -X -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE acquireiq_app LOGIN PASSWORD 'acquireiq_ci_app';"
          # psql is required: the bootstrap creates the database, uses
          # backslash commands, reconnects, and changes the active role.
          psql -X -d postgres -v ON_ERROR_STOP=1 -f scripts/setup-database.sql
          echo "DATABASE_URL=postgresql://acquireiq_app:acquireiq_ci_app@${DB_HOST}:${DB_PORT}/acquireiq" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install

      - name: Confirm dependencies actually installed
        # npm install can exit 0 in edge cases (cache issues, partial
        # installs) without producing a usable node_modules. Fail here
        # with a clear message instead of a confusing "Cannot find
        # module 'express'" a step later when the server tries to boot.
        run: |
          set -euo pipefail
          if [ ! -d "node_modules" ]; then
            echo "ERROR: node_modules not found after npm install."
            exit 1
          fi
          if [ ! -d "node_modules/express" ]; then
            echo "ERROR: node_modules exists but express is missing. Install may be incomplete."
            exit 1
          fi
          echo "Dependencies confirmed installed."

      - name: Start server in background
        run: |
          set -euo pipefail
          npm run generate:schemas
          npm run build
          nohup node dist/server.js > server.log 2>&1 &
          echo $! > server.pid
          echo "Started backend PID $(cat server.pid) in $(pwd)"
          echo "Log file: $(pwd)/server.log"

      - name: Wait for server to become healthy
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
              echo "ERROR: Backend process exited before becoming healthy."
              cat server.log
              exit 1
            fi
            if curl --connect-timeout 2 --max-time 5 -sf http://127.0.0.1:3002/api/health > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            echo "Waiting for backend health ($i/20)..."
            sleep 1
          done
          echo "Server did not become healthy in time"
          cat server.log
          exit 1

      - name: Confirm /api/health response body reports ok:true
        # A 2xx status alone doesn't prove the service is actually
        # healthy, a handler bug could return 200 with {"ok": false}
        # or malformed JSON and the previous step would still pass.
        # Check the actual body, not just the status code.
        run: |
          set -euo pipefail
          BODY=$(curl --connect-timeout 2 --max-time 5 -sf http://127.0.0.1:3002/api/health)
          echo "Response body: $BODY"
          OK=$(echo "$BODY" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const body=JSON.parse(d);console.log(body.ok===true && body.service==='acquireiq-backend')}catch(e){console.log('false')}})")
          if [ "$OK" != "true" ]; then
            echo "ERROR: /api/health did not report ok:true for acquireiq-backend."
            exit 1
          fi
          echo "/api/health body confirmed ok:true."

      - name: Confirm Swagger docs respond
        run: |
          set -euo pipefail
          STATUS=$(curl --connect-timeout 2 --max-time 5 -s -o /dev/null -w "%{http_code}" -L http://127.0.0.1:3002/api/docs)
          if [ "$STATUS" != "200" ]; then
            echo "Expected 200 from /api/docs, got $STATUS"
            exit 1
          fi
          echo "/api/docs confirmed 200."

      - name: Confirm acquisition requests can be read from PostgreSQL
        # /api/health is a liveness check and does not query the database.
        # GET /requests exercises the application's database connection,
        # role permissions, and initialized schema without needing seed data.
        run: |
          set -euo pipefail
          curl --connect-timeout 2 --max-time 10 -sf http://127.0.0.1:3002/requests \
            | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{if(!Array.isArray(JSON.parse(d)))throw new Error('Expected a requests array');console.log('/requests confirmed a database-backed JSON array.')}catch(e){console.error(e);process.exitCode=1}})"
          kill -0 "$(cat server.pid)"

      - name: Show server log on failure
        if: failure()
        run: |
          set -euo pipefail
          echo "Working directory: $(pwd)"
          if [ -f server.log ]; then
            cat server.log
          else
            echo "server.log not found in $(pwd)."
          fi
          echo "---- Diagnostics ----"
          if [ -f server.pid ]; then
            echo "server.pid: $(cat server.pid)"
            ps -o pid,stat,cmd -p "$(cat server.pid)" || echo "Process $(cat server.pid) is not running."
          else
            echo "server.pid not found."
          fi
          echo "Node processes:"
          pgrep -a node || echo "none"
          echo "Listening on port 3002:"
          (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep ":3002" || echo "nothing"
          echo "server.log files anywhere under the workspace:"
          find "${GITHUB_WORKSPACE:-$(pwd)/..}" -name server.log 2>/dev/null || true

      - name: Stop server
        if: always()
        run: |
          set -euo pipefail
          if [ -f server.pid ]; then
            PID=$(cat server.pid)
            if kill -0 "$PID" 2>/dev/null; then
              kill "$PID"
            fi
          fi
